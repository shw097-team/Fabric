schema: LOGICAL_FAR_CANDIDATE_KNOWLEDGE_V1
status: CANDIDATE_ONLY
durable_reusable_finding: >-
  "A directory cannot be renamed but its subdirectories can" identifies a cwd-pinned lock, and tells you
  the blocker is a process rather than content. Before paying to clear such a lock, test the necessity:
  if the artefact's value is its branch and uncommitted evidence rather than its location, relocation buys
  only cosmetics and should be deferred to a natural boundary such as round close.
