schema: LOGICAL_FAR_CANDIDATE_RESEARCH_V1
run_ref: FAR-20261021-024-fallback-chain-reorder
decision_question: >-
  What is the current main-model fallback chain of the canonical Hermes runtime plane under the
  HG-KSEOS control plane, which declaration surfaces declare it, and what is the exact, reversible
  execution plan to re-order it to fallback1 = MiniMax M3.1 Flash (OPENCODE GO) and
  fallback2 = MiMo-V2.6-Flash, so the live runtime chain and the HGK control-plane declaration agree
  and every arm in the new chain is proven servable?
disposition: >-
  EXECUTABLE. The owner order is executable as specified on the live canonical Hermes
  fallback_providers chain - both target ids are in the provider's live model list, both serve a
  real completion through the provider AND through the Hermes client, the per-arm api_mode is
  derived correctly by Hermes itself, the apply is a single anchored block replacement with a
  full-digest pre-image guard and a verified rollback, and the HGK control-plane declaration
  surfaces are INDEPENDENT of this chain by design (the registry binds no pointer to it and records
  it as NON_AUTHORITATIVE), so the change does not create a declaration drift. ONE QUALIFYING
  RESIDUAL is carried - while the canonical primary remains minimax-m3.1-flash-free, the runtime's
  same-backend skip refuses fallback[0] as the backend that just failed, so the first SERVABLE arm
  is mimo-v2.6-flash until the primary is not MiniMax. The chain ORDER is exactly as ordered.
