channels:
  - id: R2-A-control-plane
    target: the registry itself (acceptances, requirements, evidence) read from hg-kseos.db
    method: sqlite read; verdict counts and row-level listing; no carried numbers
  - id: R2-B-repository
    target: main, the delivery branch, worktrees, dirty state, artefacts on disk
    method: git rev-parse/ls-tree/status/cat-file and file digests
  - id: R2-C-run-records
    target: the lane dispatch receipts of this round (wpA/wpB/wpC json and attempt logs) and the officer verdicts
