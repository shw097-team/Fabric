    method: build a repaired copy of the blocked candidate in scratch and re-run C1-C6
    environment: local, scratch copy only
    commands: [python ws_a_skill_slim_regression.py --subject <candidate> --live <live tree> --out <json>]
    bounded_write_set: [_handover/CNV-PIPD-LS-SP-20261015-R9/FAR/ws3/**, _handover/CNV-PIPD-LS-SP-20261015-R9/WS_B/**]
    expected_metrics: [C1..C6 verdicts, live_references, byte_identical, absorbed_but_present_verbatim, lost]
