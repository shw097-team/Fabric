[pytest]
# Mandatory-defect 4: the suite must not write inside the tree under test.
# ``--assert=plain`` disables pytest's assertion-rewrite plugin, which would
# otherwise drop a ``tests/__pycache__/<name>...pytest-*.pyc`` INSIDE the
# deliverable before ``conftest.py`` can run. With rewriting off, ``conftest.py``
# sets ``sys.dont_write_bytecode`` early enough that no ``__pycache__`` lands in
# the deliverable. ``-p no:cacheprovider`` removes ``.pytest_cache``; the
# basetemp/scratch redirection lives in ``conftest.py::pytest_configure``.
addopts = --assert=plain -p no:cacheprovider
