  - Lanes A and B independently name ORACLE AUTHORITY (candidate tests / compiled law used as the acceptance oracle) as the mechanism behind repeated external rejections.
  - Lanes A and C independently report EVIDENCE-SET/SHA declaration defects that survive hash checks (declaration defects, not missing bytes).
  - Lanes A and B both name the missing PUBLICATION/ADMISSION ORDERING predicate.
