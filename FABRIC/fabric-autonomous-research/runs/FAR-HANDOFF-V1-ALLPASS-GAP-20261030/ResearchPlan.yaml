stopping_rule: >-
  stop when every question has a claim whose evidence is a command output in this run, AND every claim that
  asserts promotability quotes the acceptance oracle it claims to satisfy
anti_vacuity:
  - a claim without a command is UNSUPPORTED, not a finding
  - a claim that a work package may be promoted must name the oracle text and show each clause discharged
  - counts are recomputed in this run
