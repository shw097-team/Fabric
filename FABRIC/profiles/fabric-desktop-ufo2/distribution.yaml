hermes_requires: ">=0.12.0"
author: "FDA (WO-FDA-001)"
license: "MIT"
provider:
  name: MICROSOFT_UFO2
  identity_ref: "RP002_TOOL_AND_INHERITED_CAPABILITY_MATRIX.yaml -> ufo2 row"
  lifecycle: ON_DEMAND
  initial_mode: SPECIALIST_STANDBY
  transport: LOCAL_ONLY
  mcp: local_or_current_admitted_transport
