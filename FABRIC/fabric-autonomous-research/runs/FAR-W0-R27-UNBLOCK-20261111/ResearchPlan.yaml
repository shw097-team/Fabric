    target: "GitHub API pull state and check-runs for the three candidate PRs"
    method: "live API read; no carried verdicts"
subquestions:
  - "Q-a: for each residual item, is the block real, an over-read, a misread, already built, or an alternative-instrument case"
  - "Q-b: does the upstream intent actually require the item to be true now, for a single-owner single-machine unattended system"
  - "Q-c: did an earlier W0 round already solve it, and with which instrument"
  - "Q-d: which decisions are executable today, with which signing/grant instrument"
  - "Q-e: which candidates promote and which branches merge, in what order and with what rollback"
claim_classes:
  - MEASURED_STATE
  - CAPABILITY_VS_PERMISSION
  - PRIOR_ROUND_PRECEDENT
  - PROMOTABILITY
source_classes:
  - run-record
  - external-review
  - round-history
  - control-plane
  - code
  - payload
  - remote
  - experiment
  - retrieval
query_strategy:
  - "search the history for the same obstacle before proposing a mechanism"
  - "prefer an instrument that already exists over a new one"
  - "distinguish a status declaration from a block"
candidate_methods_providers:
  - "FAR R1-R8 with PLAN/EXECUTE/VERIFY lanes; PLAN and VERIFY on openai-codex/gpt-6.1-sol, EXECUTE on opencode-go/deepseek-v4.1-flash"
challenge_trigger:
  - "when a residual item's verdict differs between the maker synthesis and the PLAN lane"
  - "when a claim asserts promotability"
experiment_trigger:
  - "when a block is asserted to be environmental (B4): run the gate and read the verdict"
stop_criteria:
  - "every B-item has a verdict with a command or a quoted record"
  - "every proposed unblock names its success predicate as a runnable check"
  - "every disagreement between readers is recorded, not averaged"
abstain_criteria:
  - "no corpus and no path to it -> record NOT_REACHABLE rather than reconstruct from memory"
  - "an instrument exists but its consumer does not -> record capability, withhold authority"
budget_allocation:
  lanes: {PLAN: 1, VERIFY: 1}
  retrieval_calls: 1
  gate_runs: 2
