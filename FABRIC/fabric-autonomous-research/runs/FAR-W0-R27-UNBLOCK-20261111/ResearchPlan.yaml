    target: "HGK registry/pool/assignment, dispatcher, guard, owner_window/owner_vault/issue_grant/owner_delegation"
    method: "source read; capability vs permission separated"
  - id: R2-D-built-retrieval
    target: "far_retrieval.run_retrieval_stage (the FAR tri-source stage)"
    method: "built tool executed; RetrievalLedger.json + CrossReferenceLedger.tsv written"
