confidence: >-
  HIGH for the configuration and servability facts (every one re-measured, three workers
  concordant); MEDIUM for the residual's lifetime (it depends on a primary the owner may change).
limits:
  - "No actual failover EVENT was observed; the chain was never triggered by a live primary failure."
  - "The arm-skip finding is a property of the CURRENT primary. It is measured, not projected."
  - "The HGK registry's lane chains were deliberately NOT re-bound; their agreement with the new live chain is therefore not asserted by this run."
  - "Provider rate-limit behaviour under sustained fallback load was not measured."
  - "The curated static provider catalogue does not list either new id (as is also true of deepseek-v4.1-flash, already in the live chain); this run measures routability, not catalogue curation."
owner_action_required:
  - "OQ2: decide whether the canonical primary stays on minimax-m3.1-flash-free (which keeps the same-backend skip active for fallback[0]) or moves, which restores fallback[0] as the first servable arm."
  - "OQ1: order a lane-chain rebind round if the HGK registry's declared PLAN chain is also to name the new fallback identities."
status: CANDIDATE_ONLY
