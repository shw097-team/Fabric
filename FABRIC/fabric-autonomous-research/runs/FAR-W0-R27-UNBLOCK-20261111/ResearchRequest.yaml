why_a_new_run: >-
  the r27 round repaired what was repairable and stopped with named holds. The owner asks a second-order
  question: are those holds actually blocks, or are they a misreading, an unsearched existing capability,
  or a design choice that can be changed. That question cannot be answered by repairing more files; it has
  to be answered by researching the block itself against the records of every previous W0 round.
questions:
  - id: GQ-1
    text: "對於 W0 目前仍未完成的項目，逐項判定它是真阻斷、過度解讀、誤讀、其實已有實作、或可用替代方案（獨立車道／本地 Docker 沙盒／owner 口令信封）解開"
  - id: GQ-2
    text: "上游藍圖的設計原意（Native E2E 自主閉環、無人值守高自動化、單人單機 OWNER）是否本來就要求這些項目現在就成立；若是，我的 HOLD 是否比藍圖更嚴"
  - id: GQ-3
    text: "過去 W0 各輪（r13–r26）是否已經解過同一個阻斷，解法是什麼，有沒有可重用的程式或儀式"
  - id: GQ-4
    text: "哪些待 owner／issuer 決策項可以現在做、用什麼授權工具（簽署視窗、issuer grant、DelegationRecord）、哪些只能記錄"
  - id: GQ-5
    text: "哪些已檢測＋驗收的候選可升格實用、哪些未合併 main 的分支可併入 main、以什麼順序與回滾點進行"
