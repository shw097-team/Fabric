experiments:
  - hypothesis_ref: H-04
    method: read the dispatch receipt's attempts[] and identity_gate.arms[] for each completed turn
    environment: local control plane, read-only
    commands: [read _handover/CNV-PIPD-LS-SP-20261015/lane_runs/*dispatch_receipt*.json]
    bounded_write_set: [_handover/CNV-PIPD-LS-SP-20261015-R9/FAR/**]
